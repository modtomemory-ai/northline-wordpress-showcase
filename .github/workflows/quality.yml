name: Source quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php-and-static:
    name: PHP ${{ matrix.php }} / static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          node --check wp-content/themes/northline/assets/js/site.js
          node --check wp-content/plugins/northline-core/assets/js/projects-block.js
      - name: Validate repository structure and links
        run: python3 scripts/validate.py
